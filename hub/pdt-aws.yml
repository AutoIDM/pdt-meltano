commands:
  deploy:
    args: deploy
    description: Deploy each job schedule, or only the ones named, as a scheduled cloud job.
  describe:
    args: describe
    description: Describe the commands of this extension.
  destroy:
    args: destroy
    description: Remove everything deploy created for each schedule, or only the ones named.
  health:
    args: health
    description: Show whether the last run of each deployed schedule succeeded.
  logs:
    args: logs
    description: Read the log of one run of a deployed schedule.
  runs:
    args: runs
    description: List the recent runs of one deployed schedule.
definition: |
  deploys each job schedule of a Meltano project as a scheduled container job on AWS Batch on Fargate, using pdt. The Meltano system database, which holds each extractor's state, is kept in a pdt storage folder in your cloud account between runs.
description: Deploy each Meltano job schedule as a scheduled job on AWS Batch on Fargate
domain_url: https://www.autoidm.com/service
executable: pdt_meltano
ext_repo: https://github.com/AutoIDM/pdt-meltano
keywords:
- meltano_edk
label: pdt - deploy AWS Batch
logo_url: /assets/logos/utilities/autoidm.png
maintenance_status: development
name: pdt-aws
namespace: pdt_aws
next_steps: |-
  1. Add a job schedule if you have none: `meltano schedule add <name> --job <job> --interval '@daily'`.
  2. Deploy it: `meltano invoke pdt-aws:deploy`. The first deploy asks you to sign in to your cloud account.
pip_url: pdt-meltano
repo: https://github.com/AutoIDM/pdt
settings:
- description: The pdt provider this entry deploys to. Leave it as it is; each Hub entry sets its own.
  env: PDT_MELTANO_PROVIDER
  label: Provider
  name: provider
  value: aws
- description: Which AWS region should hold your jobs?
  env: PDT_MELTANO_REGION
  label: Region
  name: region
  value: us-east-1
variant: autoidm
