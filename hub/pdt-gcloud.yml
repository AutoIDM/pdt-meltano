commands:
  deploy:
    args: deploy
    description: Deploy each job schedule, or only the ones named, as a scheduled cloud job.
  describe:
    args: describe
    description: Describe the commands of this extension.
  destroy:
    args: destroy
    description: Remove everything deploy created for each schedule, or only the ones named.
definition: |
  deploys each job schedule of a Meltano project as a scheduled container job on Google Cloud Run Jobs, using pdt. The Meltano system database, which holds each extractor's state, is kept in a pdt storage folder in your cloud account between runs.
description: Deploy each Meltano job schedule as a scheduled job on Google Cloud Run Jobs
domain_url: https://www.autoidm.com/service
executable: pdt_meltano
ext_repo: https://github.com/AutoIDM/pdt-meltano
keywords:
- meltano_edk
label: pdt - deploy Google Cloud Run
logo_url: /assets/logos/utilities/pdt-gcloud.png
maintenance_status: development
name: pdt-gcloud
namespace: pdt_gcloud
next_steps: |-
  1. Add a job schedule if you have none: `meltano schedule add <name> --job <job> --interval '@daily'`.
  2. Deploy it: `meltano invoke pdt-gcloud:deploy`. The first deploy asks you to sign in to your cloud account. It builds the image with Docker on this computer when Docker works, else in the cloud.
  3. When a schedule has no successful run yet, deploy asks `Start a run now and show its log? [y/N]`. A run loads data. Press Enter to skip it.
pip_url: pdt-meltano
repo: https://github.com/AutoIDM/pdt
settings:
- description: The cloud this entry deploys to. Leave it as it is; each Hub entry sets its own.
  kind: string
  label: Provider
  name: provider
  value: gcloud
- description: Which Google Cloud region should hold your jobs?
  kind: string
  label: Region
  name: region
  value: us-central1
- description: The time zone of the schedule intervals, such as America/Chicago. The default is Etc/UTC. Azure accepts only Etc/UTC.
  kind: string
  label: Time Zone
  name: timezone
- description: AWS only. The AWS account that holds the jobs. pdt adds it on your first deploy.
  kind: string
  label: AWS Account
  name: account
- description: AWS only. The profile in ~/.aws to sign in with. pdt adds it if it has to ask you.
  kind: string
  label: AWS Profile
  name: profile
- description: Azure only. The Azure subscription that holds the jobs. pdt adds it on your first deploy.
  kind: string
  label: Azure Subscription
  name: subscription
- description: Azure only. The resource group for the jobs.
  kind: string
  label: Azure Resource Group
  name: resource_group
- description: Azure only. A Container Apps environment you already have, as <resource-group>/<name>.
  kind: string
  label: Azure Container Apps Environment
  name: environment
- description: Google Cloud only. The Google Cloud project that holds the jobs. pdt adds it on your first deploy.
  kind: string
  label: Google Cloud Project
  name: project
variant: autoidm
